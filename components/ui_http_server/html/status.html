<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="status-common.css">
  <script src="index.js"></script>
  <script src="status-common.js"></script>
  <style>
    /* "Now" card: which source owns the output */
    .now {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .now-main {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .art {
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      object-fit: cover;
      border-radius: 6px;
      background-color: #e9ecef;
    }

    .now-track {
      font-size: 15px;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .now-source {
      font-size: 22px;
      font-weight: bold;
    }

    .now-detail {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    /* a server asks to pair: the pairing controls are on General Settings */
    .card .pair-prompt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 0 0;
    }
  </style>
</head>
<body>
  <div id="offline" class="warning" role="status">Can't reach the device. Retrying&hellip;</div>

  <div class="cards">
    <div class="card" id="card-now">
      <div class="now">
        <div class="now-main">
          <img class="art" id="now-art" alt="" referrerpolicy="no-referrer" hidden>
          <div>
            <div class="now-source" id="now-source">Loading&hellip;</div>
            <div class="now-track" id="now-track" hidden></div>
            <div class="now-detail" id="now-detail"></div>
          </div>
        </div>
        <div class="updated" id="updated"></div>
      </div>
    </div>

    <div class="card" id="card-snapcast" hidden>
      <h2>Snapcast <span class="badge" id="badge-snapcast"></span></h2>
      <dl id="rows-snapcast"></dl>
    </div>

    <div class="card" id="card-sendspin" hidden>
      <h2>Sendspin <span class="badge" id="badge-sendspin"></span></h2>
      <dl id="rows-sendspin"></dl>
      <div class="warning pair-prompt" id="pair-prompt" role="status" hidden>
        <span id="pair-prompt-text"></span>
        <button class="btn btn-primary" id="pair-open" type="button">Open pairing</button>
      </div>
      <div class="actions" id="art-actions" hidden>
        <button class="btn btn-secondary" id="art-toggle" type="button">Hide cover art</button>
        <span class="hint">This browser loads it from the server's link.</span>
      </div>
    </div>
  </div>

  <div class="hint">Updates every 2 seconds while this tab is open. WiFi, the
    device and recent events are on the System tab; Sendspin pairing is on
    General Settings.</div>

  <script>
    'use strict';

    function trackLine(np) {
      if (!np || !has(np.title)) return null;
      const by = np.artist || np.album_artist;
      return by ? `${np.title} — ${by}` : np.title;
    }

    // ---- what each card shows: [label, value function]; null hides a row ----

    const SNAPCAST_PLAYER = {
      stopped: 'Stopped',
      syncing: 'Syncing to the server clock',
      playing: 'Playing',
      handed_over: 'Paused while Sendspin plays',
    };

    const DISCOVERY = {
      mdns: 'mDNS',
      static: 'host and port setting',
    };

    const CORRECTION = {
      none: 'clock at nominal speed',
      faster: 'clock running faster',
      slower: 'clock running slower',
    };

    const RESYNC_REASON = {
      drift: 'sync drifted over 2 ms',
      queue_empty: 'audio ran out (network gap)',
    };

    // Clock correction rate from the snapcast frame counters: frames skipped
    // (catch up) minus frames repeated (hold back) over the last minute.
    const CORRECTION_WINDOW_MS = 60000;
    let corrHistory = [];

    function trackCorrection(s) {
      if (!has(s.frames_dropped) || !has(s.frames_inserted)) {
        corrHistory = [];
        return;
      }
      const now = performance.now();
      const last = corrHistory[corrHistory.length - 1];
      if (s.player !== 'playing' ||
          (last && (now - last.t > 3 * POLL_MS ||
                    s.frames_dropped < last.dropped || s.frames_inserted < last.inserted ||
                    s.sample_rate !== last.rate))) {
        // stopped, a gap in the samples (tab hidden, device unreachable),
        // rebooted or a new format: start over
        corrHistory = [];
        if (s.player !== 'playing') return;
      }
      corrHistory.push({ t: now, dropped: s.frames_dropped, inserted: s.frames_inserted, rate: s.sample_rate });
      while (corrHistory.length > 2 && now - corrHistory[1].t >= CORRECTION_WINDOW_MS) {
        corrHistory.shift();
      }
    }

    function correctionText(s) {
      if (s.player !== 'playing') return null;
      if (!has(s.frames_dropped) || !has(s.frames_inserted)) {
        // builds that tune the clock (APLL) instead of inserting samples
        return CORRECTION[s.correction] || null;
      }
      if (corrHistory.length < 2) return 'measuring…';
      const a = corrHistory[0];
      const b = corrHistory[corrHistory.length - 1];
      const secs = (b.t - a.t) / 1000;
      if (secs < 10 || !b.rate) return 'measuring…';
      const net = (b.dropped - a.dropped) - (b.inserted - a.inserted);
      const total = (b.dropped - a.dropped) + (b.inserted - a.inserted);
      if (total === 0) return `none (last ${Math.round(secs)} s)`;
      const ppm = net / (b.rate * secs) * 1e6;
      const dir = ppm > 0 ? 'faster' : ppm < 0 ? 'slower' : 'net zero';
      const span = Math.round(secs);
      return `${Math.abs(ppm).toFixed(1)} ppm ${dir} (${total} frames in ${span} s)`;
    }

    const ROWS = {
      snapcast: [
        ['Server', s => {
          if (!has(s.server_host)) return null;
          const ip = has(s.server_ip) && s.server_ip !== s.server_host ? ` (${s.server_ip})` : '';
          return `${s.server_host}:${s.server_port}${ip}`;
        }],
        ['Found through', s => DISCOVERY[s.discovery] || null],
        ['Connection', s => s.connected
          ? `connected for ${duration(s.connected_s)}`
          : 'not connected'],
        ['Connections since boot', s => has(s.connections) ? String(s.connections) : null],
        ['Client ID', s => s.client_id || null],
        ['Stream', s => codecFormat(s)],
        ['Volume', s => volume(s)],
        ['Buffer', s => has(s.buffer_ms) ? `${s.buffer_ms} ms` : null],
        ['Latency offset', s => has(s.latency_ms) ? `${s.latency_ms} ms` : null],
        ['Player', s => {
          const p = SNAPCAST_PLAYER[s.player] || null;
          return p && s.player === 'stopped' && s.muted ? `${p} (muted on the server)` : p;
        }],
        ['Sync error', s => s.player === 'playing'
          ? (has(s.sync_error_us) ? micros(s.sync_error_us) : 'measuring…')
          : null],
        ['Clock correction', s => correctionText(s)],
        ['Audio queued', s => has(s.queued_ms) ? `${s.queued_ms} ms` : null],
        ['Playback interruptions', s => {
          if (!has(s.hard_resyncs)) return null;
          if (s.hard_resyncs === 0) return 'none since boot';
          const why = RESYNC_REASON[s.last_resync_reason];
          return `${s.hard_resyncs} since boot; last ${ago(s.last_hard_resync_s)}${why ? `, ${why}` : ''}`;
        }],
      ],
      sendspin: [
        ['State', s => s.running === false ? 'not running (see the device log)' : null],
        ['Server', s => s.running === false ? null
          : s.connected ? (s.server_name || 'connected') : 'none connected'],
        ['Access', s => {
          if (!s.connected) return null;
          const p = s.pairing;
          const rule = p ? (p.required ? '; pairing required' : '; unpaired servers allowed') : '';
          return `${s.paired ? 'paired' : 'unpaired'}${rule}`;
        }],
        ['Group', s => has(s.group_playing)
          ? `${s.group_name || 'unnamed'} (${s.group_playing ? 'playing' : 'stopped'})`
          : null],
        ['Clock sync', s => s.connected
          ? (s.time_synced
              ? (has(s.sync_error_us) ? `synced, ±${micros(s.sync_error_us).replace(/^[+−]/, '')}` : 'synced')
              : 'not yet')
          : null],
        ['Track', s => trackLine(s.now_playing)],
        ['Album', s => {
          const np = s.now_playing;
          if (!np || !has(np.album)) return null;
          const extra = [];
          if (has(np.track)) extra.push(`track ${np.track}`);
          if (has(np.year)) extra.push(String(np.year));
          return extra.length ? `${np.album} (${extra.join(', ')})` : np.album;
        }],
        ['Position', s => {
          const np = s.now_playing;
          if (!np || !has(np.progress_ms)) return null;
          // a duration of 0 means live or unknown
          return np.duration_ms > 0
            ? `${mmss(np.progress_ms)} / ${mmss(np.duration_ms)}`
            : mmss(np.progress_ms);
        }],
        ['Stream', s => s.stream ? (codecFormat(s) || 'starting') : null],
        ['Audio output', s => s.running === false ? null : s.output_open
          ? `${format(s.output_rate ? { sample_rate: s.output_rate, bits: s.output_bits } : {}) || 'open'}, snapcast paused`
          : s.output_failed ? 'could not open it (see the device log); retrying'
          : s.waiting_for_output ? 'waiting for snapcast to let go' : 'not in use'],
        ['Volume', s => volume(s)],
        ['Listening on', s => has(s.port) ? `port ${s.port}` : null],
        ['Client ID', s => s.client_id || null],
      ],
    };

    // Cover art, loaded by this browser from the URL the Sendspin server
    // sent (the board never handles images). Any Sendspin server on the LAN
    // can pick that URL while unpaired access is on, so each browser can
    // switch it off; the choice is kept in this browser only.
    function artEnabled() {
      try {
        return localStorage.getItem('statusCoverArt') !== 'off';
      } catch (e) {
        return true;
      }
    }

    function setArtEnabled(on) {
      try {
        localStorage.setItem('statusCoverArt', on ? 'on' : 'off');
      } catch (e) {
        // private mode: only for this page view
      }
      artSwitchedOff = !on;
      artUrl = null;
      updateArtToggle();
    }

    let artSwitchedOff = !artEnabled();
    let artUrl = null;
    function showArt(url) {
      const img = document.getElementById('now-art');
      const ok = !artSwitchedOff && typeof url === 'string' && /^https?:\/\//i.test(url);
      if (!ok) {
        artUrl = null;
        img.hidden = true;
        img.removeAttribute('src');
        return;
      }
      if (url !== artUrl) {
        artUrl = url;
        img.hidden = true;
        img.onload = () => { img.hidden = false; };
        img.onerror = () => {
          img.hidden = true;
          // try the same picture again in 30 s, not on every poll
          setTimeout(() => { if (artUrl === url) artUrl = null; }, 30000);
        };
        img.src = url;
      }
    }

    function updateArtToggle() {
      const btn = document.getElementById('art-toggle');
      btn.textContent = artSwitchedOff ? 'Show cover art' : 'Hide cover art';
    }

    // a server waits for the pairing window or is pairing: the controls are
    // on General Settings
    function renderPairPrompt(ss) {
      const p = ss && ss.running !== false ? ss.pairing : null;
      const box = document.getElementById('pair-prompt');
      if (!p || (!p.waiting && !p.pairing_now)) {
        box.hidden = true;
        return;
      }
      const server = p.server || 'A server';
      document.getElementById('pair-prompt-text').textContent = p.waiting
        ? `${server} asks to pair. Press the device button briefly, or allow it under General Settings.`
        : `${server} is pairing: type the code (General Settings) in it.`;
      box.hidden = false;
    }

    function render(st) {
      const out = st.output || {};
      const src = document.getElementById('now-source');
      const detail = document.getElementById('now-detail');
      if (out.source === 'snapcast') {
        src.textContent = 'Playing: Snapcast';
      } else if (out.source === 'sendspin') {
        src.textContent = 'Playing: Sendspin';
      } else {
        src.textContent = 'Idle';
      }
      detail.textContent = out.source && out.source !== 'none' && has(out.sample_rate)
        ? `Output (AUX and optical): ${format(out)}`
        : 'Nothing is playing';
      const np = out.source === 'sendspin' && st.sendspin ? st.sendspin.now_playing : null;
      const track = document.getElementById('now-track');
      const line = trackLine(np);
      track.textContent = line || '';
      track.hidden = !line;
      showArt(np && np.artwork_url);
      const anyArt = st.sendspin && st.sendspin.now_playing && has(st.sendspin.now_playing.artwork_url);
      document.getElementById('art-actions').hidden = !anyArt;

      const sc = st.snapcast;
      if (sc) {
        trackCorrection(sc);
        if (sc.player === 'handed_over') setBadge('badge-snapcast', 'paused for Sendspin', 'warn');
        else if (!sc.connected) setBadge('badge-snapcast', 'not connected', 'off');
        else if (sc.player === 'playing') setBadge('badge-snapcast', 'playing', 'ok');
        else setBadge('badge-snapcast', 'connected', 'ok');
      }
      const ss = st.sendspin;
      if (ss) {
        if (ss.running === false) setBadge('badge-sendspin', 'not running', 'warn');
        else if (ss.pairing && ss.pairing.waiting) setBadge('badge-sendspin', 'asks to pair', 'warn');
        else if (ss.output_open) setBadge('badge-sendspin', 'playing', 'ok');
        else if (ss.output_failed) setBadge('badge-sendspin', 'output error', 'warn');
        else if (ss.connected) setBadge('badge-sendspin', 'connected', 'ok');
        else setBadge('badge-sendspin', 'waiting for a server', 'off');
      }

      renderCard('snapcast', ROWS.snapcast, sc);
      renderCard('sendspin', ROWS.sendspin, ss);
      renderPairPrompt(ss);

      document.getElementById('updated').textContent =
        `Updated ${new Date().toLocaleTimeString()}`;
    }

    document.getElementById('art-toggle').addEventListener('click', () => setArtEnabled(artSwitchedOff));
    document.getElementById('pair-open').addEventListener('click', () =>
      openPage('general-settings.html', 'sendspin-pairing'));
    updateArtToggle();

    const poller = new StatusPoller(render, showReachability);

    if (liveDataBlocked()) {
      // /api/status sends no CORS header on purpose, so it can't be read
      // from a page served elsewhere (the other tabs can)
      document.getElementById('now-source').textContent = 'Not available here';
      document.getElementById('now-detail').textContent =
        'The Status tab only works on the page the device itself serves.';
    } else {
      poller.start();
    }
  </script>
</body>
</html>
